# nginx site for scrum poker; see README.md, "Behind an existing nginx".
# HTTP only on purpose: `certbot --nginx -d poker.example.com` adds the TLS server block
# and the HTTP-to-HTTPS redirect. The app sends its own Strict-Transport-Security header.
# 8100 is APP_PORT in docker-compose.yml next to this file.
server {
    listen 80;
    listen [::]:80;
    server_name poker.example.com;

    client_max_body_size 1m;

    # Room WebSockets: long-lived upgraded connections
    location /ws/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
