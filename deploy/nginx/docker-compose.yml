# Scrum poker behind an nginx that already runs on the host and ends TLS, for a machine
# whose ports 80 and 443 are taken. See README.md, "Behind an existing nginx".
# Run from this folder:
#   docker compose --env-file ../../.env up -d --build
# Starts the app only (no Caddy), published on loopback so only the host's nginx reaches it.
# APP_PORT in .env picks the host port (default 8100); poker.nijalabs.com.conf must match.

# Same project name as ../docker-compose.yml, so both use the same rooms volume.
name: scrum-poker

services:
  app:
    extends:
      file: ../docker-compose.yml
      service: app
    ports:
      - "127.0.0.1:${APP_PORT:-8100}:8000"

volumes:
  rooms:
