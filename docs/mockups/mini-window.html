<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini window</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E9F2EE}a:hover{color:#FFFFFF}
</style>
<div style="width: 340px; height: 256px; box-sizing: border-box; padding: 12px 14px; background: #123B2E; color: #E9F2EE; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; justify-content: space-between; gap: 8px">

<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
<span style="font-weight: 600; font-size: 15px">SHOP-142</span>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 22px; line-height: 1">0:18</span>
</div>
<span style="font-size: 13px; color: #A9C4B8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Save card details for faster checkout</span>
</div>

<div aria-hidden="true" style="height: 6px; border-radius: 999px; background: #2F6350; overflow: hidden"><div style="width: 60%; height: 100%; background: #E9F2EE"></div></div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 48px; border: 2px solid #F4F8F6; border-radius: 8px; background: #F4F8F6; color: #111614; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">1</button>
<button type="button" style="height: 48px; border: 2px solid #F4F8F6; border-radius: 8px; background: #F4F8F6; color: #111614; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">2</button>
<button type="button" style="height: 48px; border: 2px solid #F4F8F6; border-radius: 8px; background: #F4F8F6; color: #111614; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">3</button>
<button type="button" aria-pressed="true" style="height: 48px; border: 2px solid #F4F8F6; border-radius: 8px; background: #A84B0A; color: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">5</button>
<button type="button" style="height: 48px; border: 2px solid #F4F8F6; border-radius: 8px; background: #F4F8F6; color: #111614; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">8</button>
<button type="button" style="height: 48px; border: 2px solid #F4F8F6; border-radius: 8px; background: #F4F8F6; color: #111614; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">13</button>
<button type="button" style="height: 48px; border: 2px solid #F4F8F6; border-radius: 8px; background: #F4F8F6; color: #111614; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">21</button>
<button type="button" aria-label="Not sure" style="height: 48px; border: 2px solid #F4F8F6; border-radius: 8px; background: #F4F8F6; color: #111614; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">?</button>
</div>

<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 13px">
<span style="color: #A9C4B8">4 of 6 voted</span>
<span style="font-weight: 600">You voted 5</span>
</div>

</div>
</body>
</html>
