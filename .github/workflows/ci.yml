# Continuous integration: the Unit, Integration and E2E levels of docs/test-plan.md,
# plus the image cases (PK-01 to PK-03, PK-02 in a browser) since the runner has Docker.
# Sandbox (a real Jira Cloud site) and Manual cases stay out: they run before each release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend

  tests:
    name: Tests (unit, integration, E2E in Chromium, image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - name: Build the front end (E2E tests skip without it)
        run: npm ci && npm run build
        working-directory: frontend
      - run: playwright install --with-deps chromium
      # -rs lists every skipped test with its reason, so a silent skip shows in the log.
      - run: pytest -rs

  browsers:
    name: E2E in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci && npm run build
        working-directory: frontend
      - run: playwright install --with-deps ${{ matrix.browser }}
      - run: pytest tests/e2e -rs --browser ${{ matrix.browser }}
