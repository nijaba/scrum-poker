# Known vulnerabilities in the Python and front-end dependencies, through pip-audit (the
# Python Packaging Authority's tool, using the PyPI advisory database) and npm audit, and in
# the production image, through Trivy: the Debian packages under the app, and the Dockerfile.
# Runs when the dependencies change, every Monday, and by hand. It is not a required check,
# so a new advisory flags the dependencies without blocking unrelated pull requests.
name: Dependency audit

on:
  pull_request:
    paths:
      - pyproject.toml
      - frontend/package.json
      - frontend/package-lock.json
      - Dockerfile
      - .github/workflows/audit.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - frontend/package.json
      - frontend/package-lock.json
      - Dockerfile
      - .github/workflows/audit.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Every installed package, the dev tools included; the app itself is skipped, it is ours.
      - run: pip-audit --skip-editable

  frontend:
    name: Audit front-end dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The full report goes to the log; only moderate or worse fails the job.
      - run: npm audit || true
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend

  image:
    name: Scan the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The released binary, checked against its published checksum.
      - name: Install Trivy
        run: |
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${file}"
          echo "${TRIVY_SHA256}  ${file}" | sha256sum --check
          tar -xzf "$file" trivy
      - run: docker build -t scrum-poker:scan .
      # The full report goes to the log; only high or critical issues that have a fix fail
      # the job, since nothing can be done about the others until Debian ships one.
      - run: ./trivy image --scanners vuln scrum-poker:scan
      - run: ./trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scrum-poker:scan
      - run: ./trivy config --severity HIGH,CRITICAL --exit-code 1 .
